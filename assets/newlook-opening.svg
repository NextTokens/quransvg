<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 1050 1485" role="img" aria-labelledby="title desc">
<title id="title">Green and pink Quran opening decoration — page 1</title>
<desc id="desc">A4 portrait, right-hand page of a paired Quran opening decoration. Blank title and text panels. Original matching floral motifs and editable flat colors; entirely vector artwork.</desc>
<!-- EDIT COLORS in the style below. Groups separate the outer frame, illuminated panel, writing panel, title panel, lower cartouche, and outer-margin jewel. Page 1 is on the right of the spread, page 2 on the left. -->
<style>
    .green { fill: #286547; }
    .pink { fill: #BB427B; }
    .cream { fill: #E4DDC7; }
    .sage { fill: #B7C3AB; }
    .cream-stroke { stroke: #E4DDC7; }
    .outline { stroke: #303C32; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .line { fill: none; }
  </style>
