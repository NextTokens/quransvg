<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img" aria-label="Surah header ornament">
<title>Surah header — illuminated band</title>
<desc>Original unwan in the Madani layout (coloured ground, cream split-leaf scrollwork, lozenge rosettes, pointed cream cartouche), warm palette. Change the name in #surah-name.</desc>
